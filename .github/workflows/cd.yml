name: Continuous Delivery
on:
  release:
    types: [released]
jobs:
  cd:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Coolify builds the Dockerfile from the repository itself, so a deploy is
      # just a nudge. Database migrations run when the bot starts, and commands
      # are registered once it connects.
      - name: Trigger Coolify deployment
        run: |
          # The token goes in a config file rather than an argument: arguments
          # are visible in the process list.
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_TOKEN" > curl.conf
          trap 'rm -f curl.conf' EXIT
          curl --fail --silent --show-error --config curl.conf "$COOLIFY_WEBHOOK"
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
