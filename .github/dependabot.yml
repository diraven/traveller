# Every ecosystem lands in one weekly pull request. Security updates still
# arrive on their own as soon as an advisory is published.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    # The Node major moves together with .nvmrc and package.json's engines.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
