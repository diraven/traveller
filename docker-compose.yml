# Local development: a Postgres to point DATABASE_URL at.
#
#   docker compose up -d
#   cp .env.example .env   # fill in the Discord token
#   pnpm start
#
# Production runs on Coolify, which builds the Dockerfile and supplies its own
# Postgres and environment variables.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: traveller
      POSTGRES_DB: traveller
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  postgres:
